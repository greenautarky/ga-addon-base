name: Build & Push GA add-on base images (armv7)

# Builds the two GreenAutarky-owned armv7 add-on base images and publishes them
# to GHCR. We own these because every Home-Assistant-ecosystem armv7 base froze
# in late 2025 (hassio-addons/base at 18.2.1, home-assistant/armv7-base at
# 3.22-2025.11.1) while the iHost fleet is hardware-locked to armv7. Alpine and
# Debian THEMSELVES still ship armv7 with security updates, so we assemble a thin
# base FROM a live distro and bump it in ONE place. See README + ga-ihost-docs.
#
# ORDER IS LOAD-BEARING: build → smoke → CVE GATE → push. The image is pushed
# ONLY if the CVE gate passes, so we can never ship a base with a fixable
# HIGH/CRITICAL in its distro layer. (An earlier version pushed first and scanned
# after — that scans nothing you can un-ship. Do not reorder.)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the unpinned apk/apt security patches within the pinned
    # distro major are actually pulled AND re-scanned against the latest CVE DB
    # (a base that was clean at build rots as new CVEs land — this catches it).
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpine
            dir: alpine
            image: ga-addon-base-armv7
            base: arm32v7/alpine:3.24
            tag: "3.24"
          - flavor: debian
            dir: debian
            image: ga-addon-debian-base-armv7
            base: arm32v7/debian:trixie-slim
            tag: "trixie"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (armv7 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + LOAD locally (armv7 is single-platform, so --load works). Do NOT
      # push yet — the CVE gate below decides whether this image is allowed out.
      - name: Build ${{ matrix.image }} (load, no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/arm/v7
          load: true
          push: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=armv7
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REF=${{ github.sha }}
            BUILD_VERSION=${{ matrix.tag }}
            BUILD_REPOSITORY=${{ github.repository }}
          tags: local/${{ matrix.image }}:scan

      - name: Smoke-test (armv7)
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v7 --entrypoint sh local/${{ matrix.image }}:scan -c '
            set -e
            test -x /init
            test -x /usr/bin/bashio
            test -x /usr/bin/tempio
            command -v bash curl jq >/dev/null
            echo "OK: /init, bashio, tempio, bash/curl/jq present"
          '

      # CVE GATE on the DISTRO layer (apk/apt). A fixable HIGH/CRITICAL here means
      # the unpinned distro package has a patched version, so a rebuild fixes it —
      # so we FAIL, and the image is NOT pushed. `--ignore-unfixed` so a distro CVE
      # with no fix yet cannot permanently wedge the base. Scans the LOCAL image
      # (built above) — the gate runs before the image exists in the registry.
      # Direct trivy invocation (NOT trivy-action): the action's `pkg-types`
      # input did not scope the scan to OS packages in practice — it also scanned
      # bundled Go binaries and failed on tempio's golang.org/x/crypto CVE, which
      # we cannot fix. These exact flags are proven to scope correctly.
      - name: CVE GATE — distro packages (fixable HIGH/CRITICAL block the push)
        run: |
          scripts/cve-gate.sh local/${{ matrix.image }}:scan

      # REPORT the bundled prebuilt binaries (tempio, s6-overlay) — fixable only
      # when UPSTREAM rebuilds them, not on our schedule, so surface but never
      # block the push. (tempio 2026.07.0 bundles golang.org/x/crypto
      # CVE-2025-22869 — a HIGH whose SSH path tempio's renderer does not reach.)
      - name: CVE report — bundled libraries (visibility, non-gating)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --pkg-types library \
            --severity HIGH,CRITICAL \
            --exit-code 0 --no-progress \
            local/${{ matrix.image }}:scan

      # Reached only if the CVE gate passed. Tag + push the vetted image.
      - name: Push (gate passed — publish the vetted image)
        run: |
          set -euo pipefail
          for t in "${{ matrix.tag }}" latest; do
            docker tag local/${{ matrix.image }}:scan "ghcr.io/greenautarky/${{ matrix.image }}:$t"
            docker push "ghcr.io/greenautarky/${{ matrix.image }}:$t"
          done
