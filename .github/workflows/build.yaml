name: Build & Push GA add-on base images (armv7)

# Builds the two GreenAutarky-owned armv7 add-on base images and publishes them
# to GHCR. We own these because every Home-Assistant-ecosystem armv7 base froze
# in late 2025 (hassio-addons/base at 18.2.1, home-assistant/armv7-base at
# 3.22-2025.11.1) while the iHost fleet is hardware-locked to armv7. Alpine and
# Debian THEMSELVES still ship armv7 with security updates, so we assemble a thin
# base FROM a live distro and bump it in ONE place. See README + ga-ihost-docs.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the unpinned apk/apt security patches within the pinned
    # distro major are actually pulled (the whole point of owning the base).
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpine
            dir: alpine
            image: ga-addon-base-armv7
            base: arm32v7/alpine:3.24
            tag: "3.24"
          - flavor: debian
            dir: debian
            image: ga-addon-debian-base-armv7
            base: arm32v7/debian:trixie-slim
            tag: "trixie"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (armv7 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/arm/v7
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=armv7
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REF=${{ github.sha }}
            BUILD_VERSION=${{ matrix.tag }}
            BUILD_REPOSITORY=${{ github.repository }}
          tags: |
            ghcr.io/greenautarky/${{ matrix.image }}:${{ matrix.tag }}
            ghcr.io/greenautarky/${{ matrix.image }}:latest

      - name: Smoke-test the published image (armv7)
        run: |
          set -euo pipefail
          IMG="ghcr.io/greenautarky/${{ matrix.image }}:${{ matrix.tag }}"
          docker run --rm --platform linux/arm/v7 --entrypoint sh "$IMG" -c '
            set -e
            test -x /init
            test -x /usr/bin/bashio
            test -x /usr/bin/tempio
            command -v bash curl jq >/dev/null
            echo "OK: ${0:-image} has /init, bashio, tempio, bash/curl/jq"
          '

      # CVE scan of the BASE image. High-leverage: a CVE here propagates to EVERY
      # add-on built on this base, so catching it once beats N per-add-on scans.
      # Owning the base means we inherited this scan responsibility from upstream.
      #
      # TWO scopes, deliberately (learned from the real finding: tempio 2026.07.0
      # bundles golang.org/x/crypto CVE-2025-22869 — a HIGH we cannot fix because
      # tempio is an upstream prebuilt binary, not something we rebuild):
      #
      #  1. GATE on OS packages (apk/apt). These we CAN act on — a fixable
      #     HIGH/CRITICAL here means the unpinned distro package has a patched
      #     version, so a rebuild fixes it. Fail the build (fixes are actionable).
      #     The weekly `schedule:` rebuild re-runs this against the latest CVE DB,
      #     so an OS package that became vulnerable after build is caught within a
      #     week — the piece a build-time-only gate cannot cover.
      #  2. REPORT libraries (bundled binaries: tempio, s6-overlay). We can only
      #     fix these by bumping the tool version when UPSTREAM rebuilds, not on
      #     our schedule — so surface them for visibility, never wedge the build.
      - name: CVE gate — OS packages (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/greenautarky/${{ matrix.image }}:${{ matrix.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          pkg-types: os
          exit-code: "1"

      - name: CVE report — bundled libraries (visibility, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/greenautarky/${{ matrix.image }}:${{ matrix.tag }}
          format: table
          severity: HIGH,CRITICAL
          pkg-types: library
          exit-code: "0"
