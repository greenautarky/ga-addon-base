name: Build & Push GA add-on base images

# Builds the GreenAutarky-owned add-on base images and publishes them to GHCR.
#
# The original reason was armv7 SCARCITY: every Home-Assistant-ecosystem armv7
# base froze in late 2025 (hassio-addons/base at 18.2.1, home-assistant/armv7-base
# at 3.22-2025.11.1) while the iHost fleet is hardware-locked to armv7. Alpine and
# Debian THEMSELVES still ship armv7 with security updates, so we assemble a thin
# base FROM a live distro and bump it in ONE place.
#
# The Debian images then grew to aarch64 and amd64 for a DIFFERENT reason, and
# the distinction matters when deciding whether to own any future base: not
# because upstream stopped building them, but because upstream's Debian base
# PINS its package versions and never upgrades them, so no tag of it passes the
# CVE gate. Measured 2026-08-20 on amd64 — 9.1.0 (the tag in use): 86 fixable
# HIGH/CRITICAL; 9.4.0 (the newest): 36; ours: 0. Building FROM a live distro
# with `apt upgrade` is what makes the difference, and it is not arch-specific.
#
# Alpine deliberately stays armv7-only: upstream's current hassio-addons/base
# 21.0.2 measures 0, so owning aarch64/amd64 there would add maintenance for no
# security gain. Scarcity and staleness are different problems; only fork for
# the one you actually have. See README + ga-ihost-docs.
#
# ORDER IS LOAD-BEARING: build → smoke → CVE GATE → push. The image is pushed
# ONLY if the CVE gate passes, so we can never ship a base with a fixable
# HIGH/CRITICAL in its distro layer. (An earlier version pushed first and scanned
# after — that scans nothing you can un-ship. Do not reorder.)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the unpinned apk/apt security patches within the pinned
    # distro major are actually pulled AND re-scanned against the latest CVE DB
    # (a base that was clean at build rots as new CVEs land — this catches it).
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine: armv7 ONLY, on purpose. Upstream hassio-addons/base still
          # builds aarch64 and amd64 and its current tag is clean — measured
          # 2026-08-20, 21.0.2 = 0 fixable HIGH/CRITICAL. There is nothing to
          # own there, and owning it anyway would raise the maintenance floor
          # for no security gain.
          - flavor: alpine
            dir: alpine
            image: ga-addon-base-armv7
            base: arm32v7/alpine:3.24
            tag: "3.24"
            platform: linux/arm/v7
            build_arch: armv7
          # Debian: ALL THREE arches, and that is a different call from Alpine's
          # because the measurement is different. Upstream's Debian base pins its
          # package versions and does not upgrade them, so NO tag passes the CVE
          # gate — measured 2026-08-20 on amd64:
          #     hassio-addons/debian-base:9.1.0  (in use)   86 fixable HIGH/CRITICAL
          #     hassio-addons/debian-base:9.4.0  (newest)   36
          #     ga-addon-debian-base-armv7:trixie            0
          # Ours is clean because it runs `apt upgrade` at build time, which is
          # the whole point of building FROM a live distro. That advantage was an
          # armv7 side effect; extending it to the other two arches is what makes
          # a Debian add-on publishable at all — a matrix job that cannot pass
          # the gate blocks the store sync, and with it the armv7 image the
          # fleet actually installs.
          - flavor: debian
            dir: debian
            image: ga-addon-debian-base-armv7
            base: arm32v7/debian:trixie-slim
            tag: "trixie"
            platform: linux/arm/v7
            build_arch: armv7
          - flavor: debian
            dir: debian
            image: ga-addon-debian-base-aarch64
            base: arm64v8/debian:trixie-slim
            tag: "trixie"
            platform: linux/arm64
            build_arch: aarch64
          - flavor: debian
            dir: debian
            image: ga-addon-debian-base-amd64
            base: debian:trixie-slim
            tag: "trixie"
            platform: linux/amd64
            build_arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + LOAD locally (one platform per job, so --load works). Do NOT
      # push yet — the CVE gate below decides whether this image is allowed out.
      - name: Build ${{ matrix.image }} (load, no push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.build_arch }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            BUILD_REF=${{ github.sha }}
            BUILD_VERSION=${{ matrix.tag }}
            BUILD_REPOSITORY=${{ github.repository }}
          tags: local/${{ matrix.image }}:scan

      - name: Smoke-test (${{ matrix.build_arch }})
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh local/${{ matrix.image }}:scan -c '
            set -e
            test -x /init
            test -x /usr/bin/bashio
            test -x /usr/bin/tempio
            command -v bash curl jq >/dev/null
            echo "OK: /init, bashio, tempio, bash/curl/jq present"
          '

      # THE BOOT PATH ITSELF. Every earlier probe overrode the entrypoint, so
      # an image whose /init could not start s6 sailed through smoke, gate and
      # push — and on 2026-08-21 every add-on on this base crash-looped on
      # devices with `unable to exec .../base-addon-banner: Permission denied`
      # (exit 126, missing exec bits in the fork). This test runs the container
      # the way the Supervisor does: entrypoint /init, s6 must come up and STAY
      # up. Proven red against the broken :3.24 before the fix, green after.
      - name: Boot-test /init (the exec-bit class — banner must start, no 126)
        run: |
          set -euo pipefail
          # Runs the container the way the Supervisor does: entrypoint /init.
          # Outside a real device the base-addon-log-level oneshot MUST fail
          # (it queries the Supervisor API, which does not exist here) — that
          # exit is expected and tolerated. What is asserted is the class that
          # shipped broken on 2026-08-21: the s6 scripts were committed without
          # exec bits, every add-on crash-looped at `unable to exec ...
          # base-addon-banner: Permission denied` (126), and no probe anywhere
          # ran /init because every one overrode the entrypoint. Proven red
          # against the broken :3.24, green after the fix.
          docker run -d --name boot-probe --platform ${{ matrix.platform }} \
            local/${{ matrix.image }}:scan sleep 30 >/dev/null
          sleep 12
          LOGS=$(docker logs boot-probe 2>&1 || true)
          docker rm -f boot-probe >/dev/null
          echo "$LOGS" | tail -6
          if echo "$LOGS" | grep -qE "Permission denied|command exited 126"; then
            echo "::error::exec-bit defect: an s6 script could not be executed"
            exit 1
          fi
          if ! echo "$LOGS" | grep -q "service base-addon-banner: starting"; then
            echo "::error::the banner oneshot never even started — /init did not reach the s6 service tree"
            exit 1
          fi
          echo "boot path OK: /init ran, banner started, no permission failures"
      - name: CVE GATE — distro packages (fixable HIGH/CRITICAL block the push)
        run: |
          scripts/cve-gate.sh local/${{ matrix.image }}:scan

      # REPORT the bundled prebuilt binaries (tempio, s6-overlay) — fixable only
      # when UPSTREAM rebuilds them, not on our schedule, so surface but never
      # block the push. (tempio 2026.07.0 bundles golang.org/x/crypto
      # CVE-2025-22869 — a HIGH whose SSH path tempio's renderer does not reach.)
      - name: CVE report — bundled libraries (visibility, non-gating)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --pkg-types library \
            --severity HIGH,CRITICAL \
            --exit-code 0 --no-progress \
            local/${{ matrix.image }}:scan

      # Reached only if the CVE gate passed. Tag + push the vetted image.
      - name: Push (gate passed — publish the vetted image)
        run: |
          set -euo pipefail
          for t in "${{ matrix.tag }}" latest; do
            docker tag local/${{ matrix.image }}:scan "ghcr.io/greenautarky/${{ matrix.image }}:$t"
            docker push "ghcr.io/greenautarky/${{ matrix.image }}:$t"
          done
